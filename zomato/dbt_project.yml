name: zomato

profile: zomato

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  zomato:
    +schema: raw

models:
  zomato:
    staging : { +materialized: view, +schema: staging}
    marts : { +materialized: table, +schema: marts}
  snapshot:
    zomato: { +materialized: snapshot, +schema: snapshot}
